<!doctype html>
<html lang="en" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Library — Wild Sheep</title>
  <meta name="description" content="The complete Wild Sheep game catalogue: slots and mini-games across the Origins and Classic ranges. Filter, search, and download the full brochure.">
  <link rel="icon" href="../assets/img/logos/sheep-icon.svg" type="image/svg+xml">
  <link rel="preload" href="../assets/fonts/SCHABO-XCondensed.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body data-page="library">

<header class="site-header">
  <div class="container site-header__inner">
    <a class="site-header__logo" href="../index.html" aria-label="Wild Sheep — home">
      <span class="mark mark--wordmark"></span>
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
      <span></span><span></span>
    </button>
  </div>
</header>

<nav class="site-nav" id="site-nav" data-open="false" aria-label="Main">
  <a href="../index.html">Home</a>
  <a href="./">Game Library</a>
  <a href="../free-branded-game/">Free Branded Game!</a>
  <a href="../brochure/">Download Brochure</a>
</nav>

<main>
  <!-- == archive-game.php ============================================== -->
  <section class="library-head">
    <div class="container">
      <h1 class="display display--xl">Game Library</h1>

      <div class="filter-bar">
        <div class="filter-group">
          <p class="filter-group__label" id="filter-label">Filter by</p>
          <div class="btn-row" role="group" aria-labelledby="filter-label">
            <button class="btn" type="button" data-filter="slots"     aria-pressed="false">Slots</button>
            <button class="btn" type="button" data-filter="mini-game" aria-pressed="false">Mini Game</button>
            <button class="btn" type="button" data-filter="origins"   aria-pressed="false">Origins</button>
            <button class="btn" type="button" data-filter="classic"   aria-pressed="false">Classic</button>
          </div>
        </div>

        <div class="filter-tools">
          <div class="search">
            <label class="visually-hidden" for="game-search">Search games</label>
            <input id="game-search" type="search" placeholder="Search" data-search autocomplete="off">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="2"/>
              <path d="m12.5 12.5 4 4" stroke="currentColor" stroke-width="2"/>
            </svg>
          </div>
          <div class="select-sort">
            <label class="visually-hidden" for="game-sort">Sort games</label>
            <select id="game-sort" data-sort>
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
              <option value="az">A–Z</option>
              <option value="za">Z–A</option>
            </select>
          </div>
        </div>
      </div>

    </div>
  </section>

  <section class="library-grid">
    <div class="container">
      <p class="result-count" data-result-count role="status" aria-live="polite"></p>
      <div class="game-grid" data-library-grid></div>
      <div class="no-results" data-no-results hidden>
        <p class="display display--xs">No games match that</p>
        <p>Try clearing the filter or searching for a different title.</p>
      </div>

      <div class="library-actions">
        <button class="btn" type="button" data-show-more hidden>Show More</button>
      </div>
    </div>
  </section>

  <!-- == template-parts/upcomings.php (shared with the landing page) ====== -->
  <!-- Sits BELOW the grid and its Show More, so the page reads released
       catalogue first, then what is coming. Still driven by the filter: filter
       to Classic and the panel goes with the Origins titles in it; start typing
       a search and it goes too, because a search is a request to find one title
       rather than to browse. The unreleased titles live here rather than as
       dead tiles in the grid above. -->
  <section class="library-upcomings" data-upcomings-section hidden>
    <div class="container">
      <div class="upcomings-panel upcomings-panel--inset">
        <div>
          <h2 class="display display--md" style="color:var(--white)">Upcomings</h2>
          <div class="upcomings-rail" data-rail data-rail-flush style="margin-top:2rem">
            <div class="rail">
              <div class="rail-track" data-rail-track data-upcomings></div>
            </div>
            <div class="carousel-nav">
              <button type="button" data-rail-prev aria-label="Previous upcoming game">
                <svg width="14" height="22" viewBox="0 0 14 22" fill="none" aria-hidden="true"><path d="M12 2 3 11l9 9" stroke="currentColor" stroke-width="2.5"/></svg>
              </button>
              <button type="button" data-rail-next aria-label="Next upcoming game">
                <svg width="14" height="22" viewBox="0 0 14 22" fill="none" aria-hidden="true"><path d="M2 2l9 9-9 9" stroke="currentColor" stroke-width="2.5"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer band-dark" style="margin-top:var(--sec-y)">
  <div class="container site-footer__top">
    <div class="site-footer__brand">
      <span class="mark mark--wordmark site-footer__logo" role="img" aria-label="Wild Sheep"></span>
      <p class="site-footer__blurb" data-footer-blurb></p>
    </div>
    <!-- Rendered from site.json's `nav` — the same array the header menu
         uses, so the two can never drift apart. See initFooter(). -->
    <nav class="site-footer__nav" data-footer-nav aria-label="Footer"></nav>
  </div>

  <div class="container site-footer__bottom">
    <p class="site-footer__responsible" data-footer-responsible></p>
    <ul class="site-footer__legal" data-footer-legal hidden></ul>
    <p class="site-footer__note" data-hosting-note>Wild Sheep is hosted by Q-RGS, available through QTech Network.</p>
    <p class="site-footer__copy" data-footer-copy></p>
  </div>
</footer>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/site.js"></script>
<script src="../assets/js/library.js"></script>
</body>
</html>
