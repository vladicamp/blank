<!-- The "Origins" sub-brand word on its own, lifted out of wildsheep-origins-h.svg.
     That file holds the WILD SHEEP wordmark in a group (13 paths, y 283 to 632) and
     the Origins word as loose shapes below it; these are every shape with y > 640,
     and the viewBox is cropped to their combined bounds.

     NOTE: the word is NOT all path elements. The two "i" stems are polygons and one
     dot is a circle. Selecting only 'path' silently drops both i's and renders
     "Or g ns" — select across path, rect, circle, ellipse, polygon, polyline and
     line if you ever redo this.

     Fills are explicit so the file needs no style block. Painted as a CSS mask by
     the origins-word mark class, so only the alpha matters.

     (Careful editing this comment: XML forbids a double hyphen inside one, and an
     earlier version pasted a CSS class name containing one, which made the whole
     file invalid and the mask silently painted nothing.) -->
